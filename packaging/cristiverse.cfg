# CristiVerse settings — edit and restart the game.
# Booleans accept 1/0, true/false, yes/no, on/off.

# --- Window ---
screenW=1280
screenH=720
fullscreen=0
vsync=1

# --- World ---
# worldW/worldH are derived from cityDepth at startup (kept here for reference).
worldW=2400
worldH=2400
numAgents=1500
numBuildings=64
numTrees=140
# City density: 1 = sparse & spread out, 10 = small & tightly packed.
# Higher values shrink the world, tighten the road grid, and fill more of the
# blocks for a compact, lively city. Lower values leave organic gaps and empty
# lots so the city looks varied instead of a perfect grid. In-game (Settings).
cityDepth=7

# Building-type mix for auto-generated cities. These are weights (they don't
# have to add up to 100) — only the relative proportions matter. Police Station
# and Hospital are always added separately as one-off civic anchors. Also
# editable in-game via the Settings "BUILDING MIX" sliders.
buildingResidentialPct=50
buildingOfficePct=25
buildingIndustryPct=15
buildingParkPct=10

# --- Graphics quality (turn off for lower-end machines) ---
animations=1
shadows=1
dayNight=1
particles=1
grass=1
water=1
flowers=1

# --- Audio ---
sound=1
volume=0.5
