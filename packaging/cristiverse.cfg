# CristiVerse settings — edit and restart the game.
# Booleans accept 1/0, true/false, yes/no, on/off.

# --- Window ---
screenW=1280
screenH=720
fullscreen=0
vsync=1

# --- World ---
# worldW/worldH are derived from cityDepth at startup (kept here for reference).
worldW=2400
worldH=2400
numAgents=1500
numBuildings=64
numTrees=140
# City density: 1 = sparse & spread out, 10 = small & tightly packed.
# Higher values shrink the world, tighten the road grid, and pack buildings
# into the blocks for a compact, lively city. Also editable in-game (Settings).
cityDepth=7

# --- Graphics quality (turn off for lower-end machines) ---
animations=1
shadows=1
dayNight=1
particles=1
grass=1
water=1
flowers=1

# --- Audio ---
sound=1
volume=0.5
