# OmniVerse settings — edit and restart the game.
# Booleans accept 1/0, true/false, yes/no, on/off.

# --- Window ---
screenW=1280
screenH=720
fullscreen=0
vsync=1

# --- World ---
# Small fixed world (480×480) — all buildings fit on screen at once.
worldW=480
worldH=480
numAgents=1500
numTrees=24
# Building count in a small fixed world: 1 = ~10 buildings, 7 = ~21, 10 = ~30.
# Each building renders at native sprite resolution (48×48 for most types).
# Buildings can overlap freely; Y-sorting layers them into an organic skyline.
cityDepth=7

# Building-type mix for auto-generated cities. These are weights (they don't
# have to add up to 100) — only the relative proportions matter. Police Station
# and Hospital are always added separately as one-off civic anchors. Also
# editable in-game via the Settings "BUILDING MIX" sliders.
buildingResidentialPct=50
buildingOfficePct=25
buildingIndustryPct=15
buildingParkPct=10

# --- Graphics quality (turn off for lower-end machines) ---
animations=1
shadows=1
dayNight=1
particles=1
grass=1
water=1
flowers=1

# --- Audio ---
sound=1
volume=0.5
