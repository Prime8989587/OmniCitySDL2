name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  SDL2_VERSION: "2.30.9"

jobs:
  # ---------------------------------------------------------------------------
  windows:
    name: Windows (.exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download SDL2 (VC dev libraries)
        shell: pwsh
        run: |
          $url = "https://github.com/libsdl-org/SDL/releases/download/release-$env:SDL2_VERSION/SDL2-devel-$env:SDL2_VERSION-VC.zip"
          curl -L -o SDL2.zip $url
          Expand-Archive -Path SDL2.zip -DestinationPath sdl2 -Force

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build -A x64 `
            -DCMAKE_PREFIX_PATH="${{ github.workspace }}/sdl2/SDL2-$env:SDL2_VERSION"

      - name: Build
        run: cmake --build build --config Release

      - name: Stage package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item build/bin/Release/CristiVerse.exe dist/
          Copy-Item "sdl2/SDL2-$env:SDL2_VERSION/lib/x64/SDL2.dll" dist/
          Copy-Item README.md, MODDING.md dist/
          Copy-Item packaging/cristiverse.cfg dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CristiVerse-Windows
          path: dist

      - name: Zip for release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: Compress-Archive -Path dist/* -DestinationPath CristiVerse-Windows.zip -Force

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: CristiVerse-Windows.zip

  # ---------------------------------------------------------------------------
  linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev cmake g++

      - name: Build & package
        run: |
          chmod +x scripts/package-linux.sh
          ./scripts/package-linux.sh

      - name: Headless smoke test (renders a frame)
        run: |
          SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy \
            ./build/bin/CristiVerse --shot /tmp/shot.bmp 120
          test -s /tmp/shot.bmp && echo "Render OK"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CristiVerse-Linux
          path: dist/CristiVerse-Linux.tar.gz

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/CristiVerse-Linux.tar.gz
